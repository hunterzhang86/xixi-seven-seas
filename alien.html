<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外星人世界</title><style>*{box-sizing:border-box}body{margin:0;background:#ffd5e9;color:#623b83;font:bold 15px system-ui;text-align:center}main{max-width:540px;margin:auto;padding:10px;height:100dvh;display:flex;flex-direction:column;gap:7px}button,a{border:0;border-radius:12px;background:white;color:#58377b;padding:9px;font:bold 14px system-ui;min-height:40px;text-decoration:none}#space{flex:1;min-height:150px;max-height:420px;position:relative;overflow:hidden;background:radial-gradient(ellipse,#ffeef8,#e8a9e0);border:2px solid white;border-radius:18px;touch-action:none}#world{position:absolute;inset:0;transform-origin:center}.planet{position:absolute;touch-action:none;cursor:pointer;font-size:35px}.earth{width:142px;height:142px;left:50%;top:50%;margin:-71px;background:radial-gradient(circle at 30% 25%,#76dcff,#217edb 75%);border-radius:50%;overflow:hidden;box-shadow:0 0 20px white}.land{position:absolute;background:#75d456;border-radius:42% 60% 35% 65%}.bar,.pad{display:grid;gap:6px}.bar{grid-template-columns:repeat(3,1fr)}.pad{grid-template-columns:repeat(4,1fr)}.bar button:nth-child(1){background:#a5eb91}.bar button:nth-child(2){background:#ffdd76}.bar button:nth-child(3){background:#ffa4b5}#msg{min-height:22px;font-size:13px}body{background:radial-gradient(ellipse at top,#514a9b,#191735);color:#fff}#space{max-height:none;background:radial-gradient(ellipse at 30% 20%,#b25db966,transparent 55%),radial-gradient(ellipse at 75% 80%,#3277b977,transparent 55%),#191c49;border-color:#b7b4ff;box-shadow:0 0 24px #8e75ff55}.earth{box-shadow:0 0 24px #77cfff!important}.planet{filter:drop-shadow(0 3px 5px #0006)}button,a{background:linear-gradient(#fff,#dcd6ff);box-shadow:0 3px 0 #8d80c9}#play{background:#b4f5b4}#pause{background:#ffe49a}#stop{background:#ffb4c7}button:active{transform:scale(.95)}button:focus-visible,a:focus-visible{outline:3px solid #f5a623;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main><a href="./index.html">🏠 大厅</a><strong>👽 外星人世界 🌍</strong><div id="space"><div id="world"><div class="planet earth" data-name="地球"><div class="land" style="width:65px;height:48px;left:12px;top:19px"></div><div class="land" style="width:40px;height:70px;left:53px;top:54px;transform:rotate(22deg)"></div><div class="land" style="width:48px;height:42px;left:105px;top:10px"></div></div><div class="planet" data-name="黄色星球" style="left:9%;top:12%">🟡</div><div class="planet" data-name="黄色星球" style="left:72%;top:8%">🪐</div><div class="planet" data-name="黄色星球" style="left:12%;top:76%">🌕</div><div class="planet" data-name="蓝色旋涡" style="left:80%;top:47%">🌀</div></div></div><div id="msg">👆 点一个外星人，也可以拖动它！</div><div class="bar"><button id="play">▶️ 播放</button><button id="pause">⏸️ 暂停</button><button id="stop">⏹️ 停止</button></div><div class="pad"><button id="big">🔍➕ 放大</button><button id="up">⬆️ 上</button><button id="small">🔍➖ 缩小</button><button id="reset">↩️ 返回</button><button id="left">⬅️ 左</button><button id="down">⬇️ 下</button><button id="right">➡️ 右</button><button id="add">👽 增加</button></div></main><script>
const q=s=>document.querySelector(s),space=q('#space'),world=q('#world');let zoom=1,x=0,y=0,selected=null,animations=[],count=0;const say=t=>q('#msg').textContent=t,update=()=>world.style.transform='translate('+x+'px,'+y+'px) scale('+zoom+')';
function alien(a,b){let e=document.createElement('div');e.className='planet alien';e.dataset.name='外星人';e.textContent=['👽','👾','👽'][count++%3];e.style.left=a+'%';e.style.top=b+'%';world.append(e)}
[[8,38],[33,3],[77,26],[68,76],[32,78],[85,75]].forEach(p=>alien(...p));for(let i=0;i<18;i++){let e=document.createElement('span');e.textContent=i%3?'·':'✦';e.style.cssText='position:absolute;color:white;pointer-events:none;left:'+(i*37%97)+'%;top:'+(i*23%96)+'%';world.prepend(e)}
function dance(e,repeat=3){animations.push(e.animate([{transform:'translateY(0)'},{transform:'translateY(-18px) rotate(-15deg)'},{transform:'translateY(0) rotate(15deg)'},{transform:'translateY(0)'}],{duration:700,iterations:repeat}));say('✨ '+e.dataset.name+' 正在跳舞！')}
const pointers=new Map();let drag=null,dist=0,lastTap=0,lastEl=null;
space.onpointerdown=e=>{space.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let p=[...pointers.values()];dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);drag=null;return}let el=e.target.closest('.planet');if(el){if(selected)selected.style.outline='';selected=el;el.style.outline='2px dashed white';drag={el,x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop};say('已选中 '+el.dataset.name);let now=Date.now();if(lastEl===el&&now-lastTap<350){dance(el);lastTap=0}else{lastTap=now;lastEl=el}}};
space.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(dist>0){zoom=Math.max(.6,Math.min(2.5,zoom*d/dist));update()}dist=d}else if(drag){drag.el.style.left=drag.l+(e.clientX-drag.x)/zoom-(drag.el.classList.contains('earth')?-71:0)+'px';drag.el.style.top=drag.t+(e.clientY-drag.y)/zoom-(drag.el.classList.contains('earth')?-71:0)+'px'}};
space.onpointerup=space.onpointercancel=e=>{pointers.delete(e.pointerId);drag=null;dist=0};
q('#big').onclick=()=>{zoom=Math.min(2.5,zoom+.2);update();say('放大了！')};q('#small').onclick=()=>{zoom=Math.max(.6,zoom-.2);update();say('缩小了！')};function move(dx,dy){if(selected){let m=selected.classList.contains('earth')?71:0;selected.style.left=selected.offsetLeft+dx+m+'px';selected.style.top=selected.offsetTop+dy+m+'px'}else{x+=dx;y+=dy;update()}}
q('#left').onclick=()=>move(-15,0);q('#right').onclick=()=>move(15,0);q('#up').onclick=()=>move(0,-15);q('#down').onclick=()=>move(0,15);
q('#play').onclick=()=>{if(animations.some(a=>a.playState==='paused'))animations.forEach(a=>a.play());else{animations.forEach(a=>a.cancel());animations=[];world.querySelectorAll('.alien').forEach(e=>dance(e,Infinity))}say('▶️ 动画播放中')};q('#pause').onclick=()=>{animations.forEach(a=>a.pause());say('⏸️ 动画暂停')};q('#stop').onclick=()=>{animations.forEach(a=>a.cancel());animations=[];say('⏹️ 动画已停止')};q('#reset').onclick=()=>{q('#stop').click();zoom=1;x=y=0;if(selected)selected.style.outline='';selected=null;update();say('↩️ 回到原来的视角')};q('#add').onclick=()=>{alien(15+count*17%65,15+count*23%60);say('👽 新外星人来了！')};
</script></html>
