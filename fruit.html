<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会说话的水果世界</title><style>*{box-sizing:border-box}body{margin:0;background:#ffdf42;color:#65451d;font:bold 14px system-ui;text-align:center}main{max-width:540px;margin:auto;padding:10px}button,a{border:2px solid #c68e27;border-radius:12px;background:#fff3a5;color:#684719;padding:8px 3px;font:inherit;text-decoration:none}.toolbar,.fruits{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.tile{position:relative;border:1px solid #a97824;border-radius:10px;background:#ffe779;padding:5px}.picture{display:block;width:100%;border:0;background:transparent;font-size:40px;min-height:58px}.speak{position:absolute;right:3px;top:3px;border-radius:50%;width:29px;height:29px;padding:0}.active{background:#c6f29a;outline:2px solid #529c44}#display{height:90px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:23px}.large{font-size:65px}</style><main><a href="index.html">🏠 大厅</a><h3>🍓 会说话的水果世界</h3><div class="toolbar"><button id="stop1">❌ 停止</button><button id="start">🟢 开始阅读</button><button id="repeat">🔊 再读一次</button><button id="stop2">❌ 停止</button></div><div id="display">👆 点一点水果</div><div class="fruits"></div><p id="status">选择水果旁边的圆形按钮，就能听名字。</p></main><script>
const fruits=[['🍇','葡萄'],['🍎','苹果'],['🍐','梨子'],['🍊','橘子'],['🍊','橙子'],['🟢','阳光玫瑰'],['🫐','蓝莓'],['🔴','石榴'],['🍓','草莓'],['🥕','胡萝卜'],['🌵','仙人花']];let current=-1,auto=false,token=0;const q=s=>document.querySelector(s);function stop(){auto=false;token++;if(window.speechSynthesis)window.speechSynthesis.cancel();q('#status').textContent='⏹️ 已停止阅读'}function show(i){current=i;q('#display').innerHTML='<span class="large">'+fruits[i][0]+'</span><span>'+fruits[i][1]+'</span>';document.querySelectorAll('.tile').forEach((e,j)=>e.classList.toggle('active',i===j))}function read(i,all=false){show(i);if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){auto=false;q('#status').textContent='当前设备不支持游戏语音';return}const t=token,u=new SpeechSynthesisUtterance(fruits[i][1]);u.lang='zh-CN';u.rate=.8;q('#status').textContent='🔊 正在阅读：'+fruits[i][1];u.onend=()=>{if(t!==token)return;if(all&&auto&&i<fruits.length-1){setTimeout(()=>{if(t===token&&auto)read(i+1,true)},650)}else{auto=false;q('#status').textContent='✓ 阅读完成'}};u.onerror=()=>{if(t===token){auto=false;q('#status').textContent='语音未能播放，请检查设备语音设置'}};window.speechSynthesis.speak(u)}fruits.forEach(([icon,name],i)=>{let tile=document.createElement('div');tile.className='tile';tile.innerHTML='<button class="picture">'+icon+'</button><div>'+name+'</div><button class="speak" aria-label="朗读'+name+'">🔊</button>';tile.querySelectorAll('button').forEach(b=>b.onclick=()=>{stop();read(i)});q('.fruits').append(tile)});q('#start').onclick=()=>{stop();auto=true;read(0,true)};q('#stop1').onclick=q('#stop2').onclick=stop;q('#repeat').onclick=()=>{let i=Math.max(0,current);stop();read(i)};window.addEventListener('pagehide',stop);
</script></html>
