<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快乐一家人</title><style>*{box-sizing:border-box}body{margin:0;background:#ffe17b;color:#624b24;font:16px system-ui;height:100dvh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;padding:6px}#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:#ffe58e}#family,#tools{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:3px}button{border:1px solid #b58a42;background:#fff3b8;border-radius:9px;font-size:clamp(11px,2.5vw,16px);padding:3px;touch-action:manipulation}button b{display:block;font-size:22px}svg{position:absolute;overflow:visible;touch-action:none}.selected{filter:drop-shadow(0 0 3px #f80)}#msg{text-align:center;font-size:12px;height:18px}body{background:linear-gradient(#fff2bf,#ffd67b)}header{align-items:center;gap:4px;background:#fff8dc;border-radius:0 0 14px 14px}header a{color:#80501c;text-decoration:none;font-weight:bold}#stage{margin:5px;border:2px solid white;border-radius:18px;background:radial-gradient(ellipse at 50% 15%,#fff9d5,transparent 65%),linear-gradient(#ffe9a0 70%,#e9bd70 70%);box-shadow:inset 0 0 20px #b58a4222}#family button,#tools button{background:linear-gradient(#fffdf2,#ffe7a4);box-shadow:0 2px 0 #d3a45d}#tools button b{font-size:clamp(16px,4vw,23px)}button:active{transform:scale(.95)}button:focus-visible,a:focus-visible{outline:3px solid #f5a623;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><header><a href="./index.html">🏠 大厅</a><strong>快乐一家人</strong><button onclick="undo()">↩ 撤销</button><button onclick="copy()">📋 复制</button></header><div id="stage"></div><div id="msg">点家人，再点道具</div><div id="family"></div><div id="tools"></div><script>let people=[],sel=-1,history=[];const names=['姐姐','妈妈','爸爸','哥哥','妹妹','弟弟'],sizes=[.85,1,1.08,.92,.68,.58],colors=['#65aa50','#e84c52','#477dcc','#e7a044','#e878ae','#65b8b7'];const stage=document.querySelector('#stage'),msg=document.querySelector('#msg');function save(){history.push(JSON.stringify(people))}function undo(){if(history.length){people=JSON.parse(history.pop());sel=people.length-1;draw()}}function add(i){save();people.push({i,x:15+(people.length%5)*17,y:52,face:0,items:[],parts:{}});sel=people.length-1;draw()}function copy(){if(sel<0)return;save();let p=JSON.parse(JSON.stringify(people[sel]));p.x=Math.min(90,p.x+8);people.push(p);sel=people.length-1;draw()}function button(parent,icon,label,fn){let b=document.createElement('button');b.innerHTML='<b>'+icon+'</b>'+label;b.onclick=fn;parent.append(b)}names.forEach((n,i)=>button(document.querySelector('#family'),['👧','👩','👨','👦','👧','👶'][i],n,()=>add(i)));let tools=[['😄','开心'],['😠','生气'],['😢','不开心'],['🙂','一般'],['✋','大手'],['🤏','小手'],['👗','衣服'],['⚽','皮球'],['🌸','腮红'],['💄','口红'],['💇','发型'],['🎀','皮筋'],['🫗','大水壶'],['🧴','小水壶'],['✏️','铅笔'],['🧢','帽子'],['👖','裤子'],['👕','短袖'],['🍚','电饭锅'],['🥣','碗'],['🥢','筷子'],['🥄','勺子'],['📖','书本'],['💗','能量检查']];tools.forEach(([icon,label],i)=>button(document.querySelector('#tools'),icon,label,()=>{if(sel<0){msg.textContent='先选家人';return}save();let p=people[sel];if(i<4)p.face=i;else if(i===23){msg.textContent='头、眼睛、嘴巴、双手、双脚：可以拖动';return}else{p.items.push(i);msg.textContent=names[p.i]+'：'+label+({14:'写作业',18:'煮饭',19:'吃饭',20:'吃饭',21:'吃饭',22:'学习'}[i]||'')}draw()}));function draw(){stage.innerHTML='';people.forEach((p,k)=>{let s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 100 150');s.style.cssText='left:'+p.x+'%;top:'+p.y+'%;height:'+Math.min(75,70*sizes[p.i])+'%;width:auto;transform:translate(-50%,-50%)';if(k===sel)s.classList.add('selected');let part=(n,html)=>'<g data-part="'+n+'" transform="translate('+((p.parts[n]||[0,0]).join(' '))+')">'+html+'</g>';let has=i=>p.items.includes(i);s.innerHTML=part('头','<circle cx="50" cy="29" r="19" fill="#ffdc98" stroke="#67733b" stroke-width="2"/><path d="M32 21 Q25 0 42 12 Q50 -2 56 12 Q75 0 68 23" fill="none" stroke="#687b36" stroke-width="'+(has(10)?5:2)+'"/>')+part('眼睛','<circle cx="43" cy="27" r="2"/><circle cx="57" cy="27" r="2"/>')+part('嘴巴','<path d="'+['M42 35 Q50 45 58 35','M42 40 Q50 30 58 40','M42 41 Q50 31 58 41','M43 37 L57 37'][p.face]+'" fill="none" stroke="'+(has(9)?'#e22':'#624b24')+'" stroke-width="2"/>')+part('身体','<path d="M42 48 L58 48 L72 96 L28 96 Z" fill="'+(has(6)||has(17)?'#b45ed0':colors[p.i])+'" stroke="#67733b"/>')+part('左手','<path d="M39 53 L12 38" stroke="#67733b" stroke-width="3"/><circle cx="12" cy="38" r="'+(has(4)?7:has(5)?2:4)+'" fill="#ffdc98"/>')+part('右手','<path d="M61 53 L88 38" stroke="#67733b" stroke-width="3"/><circle cx="88" cy="38" r="4" fill="#ffdc98"/>')+part('左脚','<path d="M43 96 L37 132" stroke="'+(has(16)?'#4264ac':'#67733b')+'" stroke-width="'+(has(16)?9:3)+'"/>')+part('右脚','<path d="M57 96 L63 132" stroke="'+(has(16)?'#4264ac':'#67733b')+'" stroke-width="'+(has(16)?9:3)+'"/>')+(has(8)?'<circle cx="36" cy="35" r="4" fill="pink"/><circle cx="64" cy="35" r="4" fill="pink"/>':'')+p.items.filter(i=>![4,5,6,8,9,10,16,17].includes(i)).map((i,j)=>part('道具'+j,'<text x="'+(i===15||i===11?42:72+(j%2)*12)+'" y="'+(i===15||i===11?15:55+(j%4)*15)+'" font-size="15">'+tools[i][0]+'</text>')).join('')+'<text x="50" y="148" text-anchor="middle" font-size="10">'+names[p.i]+'</text>';s.onpointerdown=e=>{e.preventDefault();save();sel=k;let n=e.target.closest('[data-part]')?.dataset.part;let x=e.clientX,y=e.clientY,old=p.parts[n]||[0,0],px=p.x,py=p.y;s.setPointerCapture(e.pointerId);s.onpointermove=a=>{let dx=a.clientX-x,dy=a.clientY-y;if(n){let scale=s.getBoundingClientRect().height/150;p.parts[n]=[old[0]+dx/scale,old[1]+dy/scale];s.querySelector('[data-part="'+n+'"]').setAttribute('transform','translate('+p.parts[n].join(' ')+')')}else{p.x=Math.max(5,Math.min(95,px+dx/stage.clientWidth*100));p.y=Math.max(15,Math.min(85,py+dy/stage.clientHeight*100));s.style.left=p.x+'%';s.style.top=p.y+'%'}};s.onpointerup=()=>draw()};stage.append(s)})}add(0);add(1);</script></html>
