<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>希希船长：七海宝藏</title><style>*{box-sizing:border-box}body{margin:0;background:#081e33;color:white;font-family:system-ui;text-align:center}main{max-width:650px;margin:auto;padding:12px}h2{margin:8px}.hud,.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px 0}.hud span{background:#19405b;padding:8px;border-radius:9px}button{font-size:17px;font-weight:bold;background:#ffca59;color:#203449;border:0;border-radius:12px;padding:12px 16px;touch-action:manipulation}#sea{position:relative;width:100%;aspect-ratio:4/5;border:4px solid #f8c55e;border-radius:18px;overflow:hidden;background:#b4d88d}svg{width:100%;height:100%}.panel{background:#153d58;padding:14px;border-radius:16px;min-height:110px}#notice{min-height:45px}#boat{transition:x .3s,y .3s}</style><main><h2>🏴‍☠️ 希希船长：七海宝藏</h2><div class="hud"><span id="life">❤️100</span><span id="pearls">🦪0</span><span id="power">⚔️10</span><span id="vessel">⛵</span></div><div id="sea"><svg viewBox="0 0 400 500"><rect width="400" height="500" fill="#a9d28c"/><g fill="#5fa96d"><ellipse cx="55" cy="90" rx="45" ry="38"/><ellipse cx="330" cy="100" rx="60" ry="40"/><ellipse cx="100" cy="360" rx="65" ry="45"/><ellipse cx="310" cy="420" rx="62" ry="43"/></g><g font-size="28"><text x="24" y="85">🌴</text><text x="305" y="100">🌳</text><text x="75" y="355">🏠</text><text x="285" y="422">🌴</text><text x="170" y="290">🏰</text></g><path d="M60 40 C150 5 185 90 100 125 S35 210 160 205 S360 180 330 260 S160 280 115 345 S240 460 350 445" fill="none" stroke="#16578d" stroke-width="43" stroke-linecap="round"/><path d="M60 40 C150 5 185 90 100 125 S35 210 160 205 S360 180 330 260 S160 280 115 345 S240 460 350 445" fill="none" stroke="#49bce1" stroke-width="32" stroke-linecap="round"/><g id="nodes"></g><text id="boat" x="60" y="26" font-size="32" text-anchor="middle">⛵</text></svg></div><p id="notice">希希船长，点击出航，沿着蓝色水道前进！</p><div class="panel" id="panel"></div></main><script>
const P=[[60,40],[118,62],[100,125],[82,195],[160,205],[270,200],[330,260],[225,285],[115,345],[175,415],[350,445]];
let s={at:0,hp:100,pearl:0,power:10,ship:'⛵',done:[],opened:[],wins:0},mode='map',foe=0;
try{let x=JSON.parse(localStorage.getItem('xixi-save'));if(x)s={...s,...x}}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('xixi-save',JSON.stringify(s))}catch(e){}}
function note(t){$('notice').textContent=t}
function draw(){$('nodes').innerHTML=P.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="'+(i===s.at?12:9)+'" fill="'+([4,8,10].includes(i)?'#ffd76e':'#ed655b')+'" stroke="white" stroke-width="2"/><text x="'+x+'" y="'+(y+4)+'" font-size="10" text-anchor="middle">'+i+'</text>').join('');$('boat').setAttribute('x',P[s.at][0]);$('boat').setAttribute('y',P[s.at][1]-15);$('boat').textContent=s.ship;$('life').textContent='❤️'+s.hp;$('pearls').textContent='🦪'+s.pearl;$('power').textContent='⚔️'+s.power;$('vessel').textContent=s.ship;save()}
function buttons(items){$('panel').innerHTML=items.map(([t,fn])=>'<button data-f="'+fn+'">'+t+'</button>').join(' ');$('panel').querySelectorAll('button').forEach(b=>b.onclick=()=>window[b.dataset.f]())}
function menu(){mode='map';buttons([['⛵ 出航','sail'],['🛒 商店','shop'],['🚢 换船','ships'],['⚔️ 海盗PK','pk']]);draw()}
function sail(){if(s.at===10){note('🏆 已经抵达最终宝藏！');return}if(mode!=='map')return;s.at++;draw();if([4,8,10].includes(s.at)){mode='chest';note('🎁 找到双宝箱！');buttons([['🎁 左宝箱','leftChest'],['🎁 右宝箱','rightChest'],['继续','menu']])}else if(s.done.includes(s.at)){menu()}else{mode='battle';foe=10+s.at*6;note('🐙 红色关卡！海怪生命 '+foe);buttons([['💥 开炮','attack'],['🛡️ 修船','repair']])}}
function attack(){if(mode!=='battle')return;foe-=s.power;if(foe<=0){s.done.push(s.at);s.pearl+=5;note('🏆 闯关成功，获得5颗珍珠！');menu()}else{s.hp=Math.max(0,s.hp-6);note('命中海怪！它还剩 '+foe+' 生命，你损失6生命。');if(s.hp===0){s.hp=100;note('小船自动修好了！')}}draw()}
function repair(){s.hp=Math.min(100,s.hp+15);note('❤️ 船只修好了！');draw()}
function chest(n){let key=s.at*2+n;if(s.opened.includes(key)){note('这个宝箱已经打开啦！');return}s.opened.push(key);s.pearl+=n?10:6;note('✨ 获得 '+(n?10:6)+' 颗珍珠！');draw()}
function leftChest(){chest(0)}function rightChest(){chest(1)}
function shop(){mode='shop';note('🛒 用珍珠让小船变强');buttons([['⚔️ 升级 5🦪','upgrade'],['❤️ 修复 3🦪','heal'],['返回','menu']])}
function upgrade(){if(s.pearl<5){note('珍珠不够！');return}s.pearl-=5;s.power+=10;note('船炮升级成功！');draw()}
function heal(){if(s.pearl<3){note('珍珠不够！');return}s.pearl-=3;s.hp=100;note('船只修好了！');draw()}
function ships(){mode='ships';buttons([['⛵ 木帆船','wood'],['🚤 快艇 8🦪','speed'],['🚢 黄金战舰 15🦪','gold'],['返回','menu']])}
function wood(){s.ship='⛵';menu()}
function speed(){if(s.pearl<8){note('珍珠不够！');return}s.pearl-=8;s.ship='🚤';s.power+=5;menu()}
function gold(){if(s.pearl<15){note('珍珠不够！');return}s.pearl-=15;s.ship='🚢';s.power+=15;menu()}
function pk(){mode='pk';note('⚔️ 海盗竞技场：敌人战力 '+(20+s.wins*10));buttons([['⚔️ 开始PK','fight'],['返回','menu']])}
function fight(){if(s.power>=20+s.wins*10){s.wins++;s.pearl+=10;note('🏆 PK胜利，获得10颗珍珠！')}else{s.hp=Math.max(1,s.hp-20);note('PK失败，先升级船炮吧！')}menu();draw()}
menu();</script></html>
