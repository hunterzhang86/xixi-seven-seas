<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>希希的兔兔化妆屋</title><style>*{box-sizing:border-box}body{margin:0;background:#fff0f6;font:18px system-ui;text-align:center;color:#813c68}main{max-width:650px;margin:auto;padding:12px}button{border:2px solid #e7a6c9;border-radius:14px;background:white;padding:10px;font-size:24px;margin:3px}button.on{outline:3px solid #aa438b}svg{width:100%;max-height:52vh;background:#fce1ef;border-radius:24px;touch-action:none}.tools{touch-action:none}.sw{width:42px;height:42px;vertical-align:middle}h2{margin:8px}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}.tools button{padding:5px;background:linear-gradient(#fff,#ffe2ef);touch-action:none}.tools svg,#held svg{width:48px;height:65px;background:none;border-radius:0;display:block}.tools small{display:block;font-size:11px}#held{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-80%);filter:drop-shadow(0 4px 4px #92577788)}#held[hidden]{display:none}#colors{touch-action:none}.sw{border-radius:50%;box-shadow:inset 0 3px 4px #ffffff88}#nav button{padding:7px;font-size:18px}html,body{height:100%;overflow:hidden}body{overscroll-behavior:none}main{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px max(6px,env(safe-area-inset-bottom));max-width:850px}main>a{flex:none;padding:5px 12px!important;font-size:14px}h2{flex:none;margin:0;font-size:clamp(16px,3vh,24px)}#nav{flex:none;display:flex;justify-content:center;gap:3px;width:100%}#nav button{margin:0;padding:4px;min-width:0;flex:0 1 42px;font-size:16px}#face{flex:1 1 0;min-height:0;max-height:none;width:100%;display:block}#tools{flex:none;width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}#tools button{min-width:0;margin:0;padding:3px 1px}#tools svg{width:100%;height:clamp(25px,7vh,58px)}#tools small{font-size:clamp(9px,1.6vh,12px);white-space:nowrap}#colors{flex:none;display:flex;justify-content:center;gap:5px;width:100%}#colors button{margin:0;padding:0;width:clamp(23px,5vh,40px);height:clamp(23px,5vh,40px)}main>p{display:none}main>button{flex:none;margin:0;padding:4px 16px;font-size:16px}@media(orientation:landscape) and (max-height:600px){main{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,42%);grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:4px}main>a{grid-column:1;grid-row:1;justify-self:start}h2{grid-column:2;grid-row:1}#nav{grid-column:1/-1;grid-row:2}#face{grid-column:1;grid-row:3/6;height:100%}#tools{grid-column:2;grid-row:3;grid-template-columns:repeat(4,minmax(0,1fr));align-content:center}#colors{grid-column:2;grid-row:4}main>button{grid-column:2;grid-row:5;justify-self:center}}body{background:radial-gradient(ellipse at top,#fff9fc,#f6b9dc)}#face{background:radial-gradient(ellipse at 50% 35%,#fffafc,#f8c4e0);border:2px solid white;box-shadow:inset 0 0 24px #c85b9b33}#tools button{border-color:#e4a6ce;box-shadow:0 2px 0 #c884b0}button.on{outline:2px solid #9b3c8d;background-color:#fff}h2{color:#963d80}button:active{transform:scale(.95)}button:focus-visible,a:focus-visible{outline:3px solid #f5a623;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main><a href="./" style="display:inline-block;background:white;color:#7046b5;border-radius:14px;padding:10px 18px;text-decoration:none;font-weight:bold">🏠 返回大厅</a><h2>🐰 希希的兔兔化妆屋</h2><div id="nav"></div><svg id="face" viewBox="0 0 320 340"></svg><div class="tools" id="tools"></div><div id="colors"></div><p>🖌️ → 🎨 → 🐰</p><button onclick="undo()">↶ 撤回</button><div id="held" hidden></div></main><script>let level=0,tool=0,color='#ee609b',marks=Array.from({length:8},()=>[]),drag=false,history=Array.from({length:8},()=>[]),active=null,lastPoint=null;const $=x=>document.getElementById(x),palette=['#ee609b','#ed3939','#f8ad56','#a675e5','#65bce8','#68cba2','#754c38','#ffe7a0'],icons=['💄','🖌️','👁️','✏️','✨','🎀','🧽'];function choose(i){level=(i+8)%8;draw()}function undo(){if(history[level].length)marks[level]=history[level].pop();draw()}function draw(){let fur=['#fffaf0','#ead3bb','#fff','#d6c3ec','#f4d4c6','#e6e7ed','#fff0d0','#d9c0a8'][level],hair=palette[level];$('nav').innerHTML='<button onclick="choose(level-1)">⬅️</button>'+marks.map((_,i)=>'<button class="'+(i===level?'on':'')+'" onclick="choose('+i+')">'+(i+1)+'</button>').join('')+'<button onclick="choose(level+1)">➡️</button>';$('face').innerHTML='<ellipse cx="160" cy="320" rx="95" ry="62" fill="'+hair+'"/><g fill="'+fur+'" stroke="#b98da3" stroke-width="2"><ellipse cx="105" cy="82" rx="30" ry="75" transform="rotate('+(-12-level*3)+' 105 82)"/><ellipse cx="215" cy="82" rx="30" ry="75" transform="rotate('+(12+level*3)+' 215 82)"/><ellipse cx="160" cy="190" rx="110" ry="105"/></g><g fill="#f5b4c9"><ellipse cx="105" cy="75" rx="14" ry="49"/><ellipse cx="215" cy="75" rx="14" ry="49"/></g><path d="'+['M65 145 Q80 60 160 90 Q240 65 255 145 Q190 100 160 150 Q120 100 65 145','M65 145 Q70 65 160 90 Q250 65 255 145 Q160 85 65 145','M65 145 Q90 65 160 90 Q230 65 255 145 L220 170 L180 110 L120 160 Z','M65 145 Q80 65 160 90 Q240 65 255 145 Q200 180 160 110 Q120 180 65 145'][level%4]+'" fill="'+hair+'"/><g fill="#49354c"><ellipse cx="115" cy="190" rx="12" ry="17"/><ellipse cx="205" cy="190" rx="12" ry="17"/></g><g fill="white"><circle cx="111" cy="185" r="4"/><circle cx="201" cy="185" r="4"/></g><path d="M150 220 Q160 230 170 220 Q160 210 150 220" fill="#d77a9c"/><path d="M160 228 Q145 250 135 235 M160 228 Q175 250 185 235" fill="none" stroke="#8a5369" stroke-width="3"/>'+marks[level].map(m=>m.t>=4?'<text x="'+m.x+'" y="'+m.y+'" font-size="26" text-anchor="middle">'+icons[m.t]+'</text>':'<circle cx="'+m.x+'" cy="'+m.y+'" r="'+[8,16,10,3][m.t]+'" fill="'+m.c+'" opacity="'+(m.t===1?.35:.8)+'"/>').join('');$('tools').innerHTML=icons.map((v,i)=>'<button class="'+(tool===i?'on':'')+'" data-tool="'+i+'">'+art(i)+'<small>'+['口红','腮红','眼影','眉笔','亮片','蝴蝶结','橡皮擦'][i]+'</small></button>').join('');$('colors').innerHTML=palette.map(c=>'<button class="sw '+(c===color?'on':'')+'" data-color="'+c+'" style="background:'+c+'"></button>').join('')}function art(i){let shapes=['<rect x="18" y="35" width="24" height="35" rx="4" fill="#ad638d"/><rect x="21" y="29" width="18" height="12" fill="#eac45c"/><path d="M23 30V12Q24 4 37 3V30Z" fill="'+color+'"/>','<rect x="26" y="30" width="9" height="43" rx="4" fill="#b66b9d"/><rect x="23" y="26" width="15" height="12" fill="#e5bd69"/><ellipse cx="30" cy="17" rx="19" ry="16" fill="'+color+'"/>','<rect x="4" y="18" width="52" height="44" rx="8" fill="#a56b92"/><rect x="8" y="22" width="44" height="36" rx="5" fill="#ffe9ef"/><circle cx="20" cy="33" r="8" fill="'+color+'"/><circle cx="40" cy="33" r="8" fill="#c19bea"/><circle cx="20" cy="49" r="8" fill="#efab85"/><circle cx="40" cy="49" r="8" fill="#d47a9f"/>','<path d="M25 15L30 2L35 15V68H25Z" fill="'+color+'" stroke="#79506b"/><path d="M25 15H35" stroke="#eacb94" stroke-width="5"/>','<rect x="12" y="25" width="36" height="43" rx="9" fill="'+color+'"/><rect x="16" y="12" width="28" height="16" rx="4" fill="#e7c16e"/><text x="30" y="54" text-anchor="middle" font-size="23" fill="white">✦</text>','<path d="M30 38Q2 5 3 38Q2 68 30 42Q58 68 57 38Q58 5 30 38" fill="'+color+'" stroke="#a45a87"/><circle cx="30" cy="40" r="8" fill="#e9bb67"/>','<rect x="8" y="23" width="44" height="34" rx="12" fill="#f6d56f" stroke="#cba34b"/><g fill="#e0b94f"><circle cx="19" cy="34" r="3"/><circle cx="38" cy="43" r="4"/><circle cx="27" cy="49" r="2"/></g>'];return '<svg viewBox="0 0 60 76" aria-hidden="true">'+shapes[i]+'</svg>'}function paint(e){let s=$('face'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(s.getScreenCTM().inverse());if(p.x<0||p.x>320||p.y<0||p.y>340)return;let a=marks[level];if(tool===6){marks[level]=a.filter(m=>Math.hypot(m.x-p.x,m.y-p.y)>24)}else{let prev=lastPoint;if(prev&&Math.hypot(prev.x-p.x,prev.y-p.y)<5)return;if(tool>=4&&prev)return;a.push({x:p.x,y:p.y,t:tool,c:color});lastPoint={x:p.x,y:p.y}}draw()}function held(e){let h=$('held');h.hidden=false;h.innerHTML=art(tool);h.style.left=e.clientX+'px';h.style.top=e.clientY+'px'}function move(e){if(active!==e.pointerId)return;let b=document.elementFromPoint(e.clientX,e.clientY);if(b?.dataset.color){color=b.dataset.color;draw()}else if(b?.closest('#face'))paint(e);held(e)}document.addEventListener('pointerdown',e=>{if(active!==null)return;let b=e.target.closest('[data-tool],[data-color]');if(!b&&!e.target.closest('#face'))return;e.preventDefault();if(b?.dataset.tool!==undefined)tool=+b.dataset.tool;else if(b?.dataset.color)color=b.dataset.color;active=e.pointerId;lastPoint=null;history[level].push(marks[level].map(m=>({...m})));draw();held(e);if(!b)paint(e)});document.addEventListener('pointermove',move);function finish(e){if(active!==e.pointerId)return;if(e.type==='pointerup')move(e);active=null;$('held').hidden=true;lastPoint=null}document.addEventListener('pointerup',finish);document.addEventListener('pointercancel',finish);draw();</script></html>
