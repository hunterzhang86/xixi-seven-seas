<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>希希的兔兔化妆屋</title><style>*{box-sizing:border-box}body{margin:0;background:#fff0f6;font:18px system-ui;text-align:center;color:#813c68}main{max-width:650px;margin:auto;padding:12px}button{border:2px solid #e7a6c9;border-radius:14px;background:white;padding:10px;font-size:24px;margin:3px}button.on{outline:3px solid #aa438b}svg{width:100%;max-height:52vh;background:#fce1ef;border-radius:24px;touch-action:none}.tools{touch-action:none}.sw{width:42px;height:42px;vertical-align:middle}h2{margin:8px}</style><main><a href="./" style="display:inline-block;background:white;color:#7046b5;border-radius:14px;padding:10px 18px;text-decoration:none;font-weight:bold">🏠 返回大厅</a><h2>🐰 希希的兔兔化妆屋</h2><div id="nav"></div><svg id="face" viewBox="0 0 320 340"></svg><div class="tools" id="tools"></div><div id="colors"></div><p>🖌️ → 🎨 → 🐰</p><button onclick="undo()">↶</button></main><script>let level=0,tool=0,color='#ee609b',marks=Array.from({length:8},()=>[]),drag=false;const $=x=>document.getElementById(x),palette=['#ee609b','#ed3939','#f8ad56','#a675e5','#65bce8','#68cba2','#754c38','#ffe7a0'],icons=['💄','🖌️','👁️','✏️','✨','🎀'];function choose(i){level=(i+8)%8;draw()}function undo(){marks[level].pop();draw()}function draw(){let fur=['#fffaf0','#ead3bb','#fff','#d6c3ec','#f4d4c6','#e6e7ed','#fff0d0','#d9c0a8'][level],hair=palette[level];$('nav').innerHTML='<button onclick="choose(level-1)">⬅️</button>'+marks.map((_,i)=>'<button class="'+(i===level?'on':'')+'" onclick="choose('+i+')">'+(i+1)+'</button>').join('')+'<button onclick="choose(level+1)">➡️</button>';$('face').innerHTML='<ellipse cx="160" cy="320" rx="95" ry="62" fill="'+hair+'"/><g fill="'+fur+'" stroke="#b98da3" stroke-width="2"><ellipse cx="105" cy="82" rx="30" ry="75" transform="rotate('+(-12-level*3)+' 105 82)"/><ellipse cx="215" cy="82" rx="30" ry="75" transform="rotate('+(12+level*3)+' 215 82)"/><ellipse cx="160" cy="190" rx="110" ry="105"/></g><g fill="#f5b4c9"><ellipse cx="105" cy="75" rx="14" ry="49"/><ellipse cx="215" cy="75" rx="14" ry="49"/></g><path d="'+['M65 145 Q80 60 160 90 Q240 65 255 145 Q190 100 160 150 Q120 100 65 145','M65 145 Q70 65 160 90 Q250 65 255 145 Q160 85 65 145','M65 145 Q90 65 160 90 Q230 65 255 145 L220 170 L180 110 L120 160 Z','M65 145 Q80 65 160 90 Q240 65 255 145 Q200 180 160 110 Q120 180 65 145'][level%4]+'" fill="'+hair+'"/><g fill="#49354c"><ellipse cx="115" cy="190" rx="12" ry="17"/><ellipse cx="205" cy="190" rx="12" ry="17"/></g><g fill="white"><circle cx="111" cy="185" r="4"/><circle cx="201" cy="185" r="4"/></g><path d="M150 220 Q160 230 170 220 Q160 210 150 220" fill="#d77a9c"/><path d="M160 228 Q145 250 135 235 M160 228 Q175 250 185 235" fill="none" stroke="#8a5369" stroke-width="3"/>'+marks[level].map(m=>m.t>=4?'<text x="'+m.x+'" y="'+m.y+'" font-size="26" text-anchor="middle">'+icons[m.t]+'</text>':'<circle cx="'+m.x+'" cy="'+m.y+'" r="'+[8,16,10,3][m.t]+'" fill="'+m.c+'" opacity="'+(m.t===1?.35:.8)+'"/>').join('');$('tools').innerHTML=icons.map((v,i)=>'<button class="'+(tool===i?'on':'')+'" data-tool="'+i+'">'+v+'</button>').join('');$('colors').innerHTML=palette.map(c=>'<button class="sw '+(c===color?'on':'')+'" data-color="'+c+'" style="background:'+c+'"></button>').join('')}function paint(e){let s=$('face'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(s.getScreenCTM().inverse());if(p.x<0||p.x>320||p.y<0||p.y>340)return;let a=marks[level],last=a[a.length-1];if(last&&Math.hypot(last.x-p.x,last.y-p.y)<5)return;a.push({x:p.x,y:p.y,t:tool,c:color});draw()}document.addEventListener('pointerdown',e=>{let b=e.target.closest('[data-tool],[data-color]');if(b){if(b.dataset.tool!==undefined)tool=+b.dataset.tool;else color=b.dataset.color;drag=true;draw()}else if(e.target.closest('#face')){drag=true;paint(e)}});document.addEventListener('pointermove',e=>{if(!drag)return;let b=document.elementFromPoint(e.clientX,e.clientY);if(b?.dataset.color){color=b.dataset.color;draw()}else if(b?.closest('#face'))paint(e)});document.addEventListener('pointerup',()=>drag=false);document.addEventListener('pointercancel',()=>drag=false);draw();</script></html>
