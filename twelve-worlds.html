<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十二个快乐小世界</title><style>*{box-sizing:border-box}body{margin:0;background:#ffdc43;color:#285d35;font:bold 14px system-ui;text-align:center}main{max-width:540px;margin:auto;padding:8px}button,a{border:0;border-radius:9px;background:#fff2ae;color:#80501c;font:bold 14px system-ui;padding:9px;text-decoration:none}.layout{display:flex;gap:6px}.viewport{flex:1;overflow:hidden;height:min(65dvh,440px);border:2px solid #476a36;touch-action:none}.board{display:grid;grid-template-columns:repeat(3,1fr);transform-origin:center}.scene{height:min(16dvh,109px);position:relative;border:1px solid #54733a;overflow:hidden}.person{position:absolute;width:42px;height:65px;left:8%;top:12%;touch-action:none}.prop{position:absolute;right:5%;bottom:9%;font-size:25px}.ball{position:absolute;right:5%;top:5%}.side{display:flex;flex-direction:column;gap:7px;width:54px}dialog{background:#ffed94;border:0;border-radius:12px;width:min(90vw,400px)}.screen{height:220px;position:relative}.screen .person{width:90px;height:145px;left:25%;top:15%}.screen .prop{font-size:65px;right:18%;bottom:15%}body{background:linear-gradient(#fff3a5,#ffd34b)}.viewport{border:2px solid #fff;border-radius:14px;box-shadow:0 4px 12px #b68c3b55}.scene{background:radial-gradient(circle at 30% 20%,#fff9c7,#ffe18a);border:1px solid #d6a64a}.scene:nth-child(3n+2){background:linear-gradient(#fff4be,#ffd991)}.scene:nth-child(3n){background:linear-gradient(#fff5c7,#e9ed9d)}.person{filter:drop-shadow(0 3px 2px #8a753844)}button,a{background:linear-gradient(#fffdf1,#ffe7a0);box-shadow:0 3px 0 #c99a3f}dialog::backdrop{background:#382b1766}button:active{transform:scale(.95)}button:focus-visible,a:focus-visible{outline:3px solid #f5a623;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main><a href="index.html">🏠 大厅</a><h3>🌟 十二个快乐小世界</h3><div class="layout"><div class="viewport"><div class="board"></div></div><div class="side"><button id="back">↩️ 返回</button><button id="up">⬆️ 上</button><button id="down">⬇️ 下</button><button id="big">🔍 大</button></div></div><p id="note">👆 点小人、拖动，或者连点两下！</p><dialog id="movie"><div class="screen"></div><button id="play">▶️ 播放</button><button id="pause">⏸️ 暂停</button><button id="stop">⏹️ 停止</button><button id="close">↩️ 返回</button></dialog></main><script>
const q=s=>document.querySelector(s),board=q('.board'),props=['🪥','🪮','🧹','🏓','✏️','🧸','🪧','🔦','🛏️','🧺','📖','🗓️'];let scale=1,y=0,selected=null,last=0,lastId=-1,animations=[];
const art=i=>'<svg viewBox="0 0 60 90" width="100%" height="100%"><g stroke="#326d3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="30" cy="21" r="15"/><path d="M23 25 Q30 33 38 24 M30 36 L16 65 L44 65 Z M23 65 L21 85 M37 65 L39 85 M22 45 L6 35 M38 45 L54 34 M16 10 L10 4 M23 7 L20 0 M30 6 L30 0 M38 7 L42 0 M44 11 L52 5"/><circle cx="24" cy="18" r="1.5" fill="#326d3d"/><circle cx="36" cy="18" r="1.5" fill="#326d3d"/>'+(i===1||i===10?'<path d="M14 12 Q0 12 8 23 Q0 30 9 37 M46 12 Q60 12 52 23 Q60 30 51 37"/>':'')+'</g></svg>';
const say=t=>q('#note').textContent=t;function motion(e,loop=false){animations.push(e.animate([{transform:'translateY(0)'},{transform:'translateY(-10px) rotate(-12deg)'},{transform:'rotate(12deg)'},{transform:'translateY(0)'}],{duration:850,iterations:loop?Infinity:2}))}function stop(){animations.forEach(a=>a.cancel());animations=[]}function bind(e,i){let drag=null;e.onpointerdown=ev=>{e.setPointerCapture(ev.pointerId);drag={x:ev.clientX,y:ev.clientY,l:e.offsetLeft,t:e.offsetTop,moved:false};selected=e};e.onpointermove=ev=>{if(!drag)return;let dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){drag.moved=true;let p=e.parentElement,s=p.classList.contains('scene')?scale:1;e.style.left=Math.max(0,Math.min(p.clientWidth-e.offsetWidth,drag.l+dx/s))+'px';e.style.top=Math.max(0,Math.min(p.clientHeight-e.offsetHeight,drag.t+dy/s))+'px'}};e.onpointerup=()=>{if(!drag)return;if(!drag.moved){let now=Date.now();if(lastId===i&&now-last<400&&!q('#movie').open){movie(i);last=0}else{motion(e);last=now;lastId=i;say('✨ 第'+(i+1)+'个小人动起来啦！')}}drag=null};e.onpointercancel=()=>drag=null}
function scene(i){return '<span class="ball">🟢</span><div class="person">'+art(i)+'</div><span class="prop">'+props[i]+'</span>'}for(let i=0;i<12;i++){let s=document.createElement('div');s.className='scene';s.innerHTML=scene(i);board.append(s);bind(s.querySelector('.person'),i);s.onclick=e=>{if(!e.target.closest('.person'))motion(s.querySelector('.person'))}}
function movie(i){stop();q('.screen').innerHTML=scene(i);let p=q('.screen .person');bind(p,i);q('#movie').showModal();motion(p,true)}q('#play').onclick=()=>{if(animations.some(a=>a.playState==='paused'))animations.forEach(a=>a.play());else{stop();motion(q('.screen .person'),true)}};q('#pause').onclick=()=>animations.forEach(a=>a.pause());q('#stop').onclick=stop;q('#close').onclick=()=>q('#movie').close();q('#movie').onclose=()=>{stop();selected=null};function update(){board.style.transform='translateY('+y+'px) scale('+scale+')'}q('#back').onclick=()=>{stop();selected=null;scale=1;y=0;update()};function move(d){if(selected){selected.style.top=Math.max(0,Math.min(selected.parentElement.clientHeight-selected.offsetHeight,selected.offsetTop+d*10))+'px'}else{y+=d*35;update()}say(d<0?'⬆️ 往上移动':'⬇️ 往下移动')}q('#up').onclick=()=>move(-1);q('#down').onclick=()=>move(1);q('#big').onclick=()=>{scale=scale>=2?1:scale+.25;update();say('🔍 放大 '+Math.round(scale*100)+'%')};
</script></html>
