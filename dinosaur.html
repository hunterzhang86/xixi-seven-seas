<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侏罗纪争霸</title><style>*{box-sizing:border-box}body{margin:0;background:#142b26;color:white;font:16px system-ui}main{max-width:540px;margin:auto;padding:12px}button,a{font:inherit;padding:12px;background:#365c48;color:white;border:0;border-radius:9px}section{display:flex;justify-content:space-around;align-items:center;background:linear-gradient(#73a9bc,#9bc77a 70%,#426a38 71%);height:clamp(100px,25dvh,180px);border-radius:12px;font-size:64px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}progress{width:45%;accent-color:#8cdb75}p{margin:8px 0}dialog{background:#254638;color:white;border:0;border-radius:12px}dialog button{margin:4px}</style><main><a href="hall.html">大厅</a> <b>侏罗纪争霸</b> <span id="level"></span><p id="stats"></p><progress id="a" max="100"></progress> <progress id="b" max="100"></progress><section><span id="left">🦕</span><span id="right">🦖</span></section><p id="msg">开始冒险！</p><nav><button onclick="hit(0,10)">左攻击</button><button onclick="hit(0,18)">左技能</button><button onclick="hit(0,25)">左发射</button><button onclick="hit(1,10)">右攻击</button><button onclick="hit(1,18)">右技能</button><button onclick="hit(1,25)">右发射</button><button onclick="menu('喂食')">喂食</button><button onclick="menu('医疗')">医疗</button><button onclick="menu('商店')">商店</button><button onclick="menu('领养')">领养</button><button onclick="menu('学习')">学习</button><button onclick="next()">下一集</button></nav><dialog id="panel"><div id="options"></div><button onclick="panel.close()">返回</button></dialog></main><script>let ep=0,h=[100,100],coins=[120,120],food=[80,80],pet=['无','无'],iq=[0,0],armor=[false,false];const pairs=[['三角龙','霸王龙'],['剑龙','迅猛龙'],['甲龙','异特龙'],['腕龙','棘龙'],['厚头龙','牛龙'],['副栉龙','角鼻龙'],['雷龙','南方巨兽龙'],['三角龙','霸王龙']];function draw(){level.textContent='第'+(ep+1)+'/8集';stats.textContent=pairs[ep].map((n,i)=>n+' '+coins[i]+'🪙 饱食'+food[i]).join(' ｜ ');a.value=h[0];b.value=h[1]}function hit(i,n){if(h.some(x=>x<=0))return;let j=1-i;h[j]=Math.max(0,h[j]-Math.max(1,n-(armor[j]?5:0)));coins[i]+=2;food[i]=Math.max(0,food[i]-5);msg.textContent=h[j]===0?pairs[ep][i]+' 获胜！':pairs[ep][i]+' 攻击！';document.getElementById(j?'right':'left').animate([{transform:'translateX(0)'},{transform:'translateX(12px)'},{transform:'translateX(0)'}],300);draw()}function next(){ep=(ep+1)%8;h=[100,100];draw();msg.textContent='新的挑战！'}function menu(k){options.replaceChildren();for(let i=0;i<2;i++){let p=document.createElement('p');p.textContent=pairs[ep][i];options.append(p);for(let v of ({喂食:['青草','苹果','肉块'],医疗:['治疗'],商店:['盔甲'],领养:['小狗','小猫','小恐龙'],学习:['数数','跳跃']}[k])){let btn=document.createElement('button');btn.textContent=v;btn.onclick=()=>{let c=k==='喂食'?20:3;if(coins[i]<c){msg.textContent='金币不足';return}coins[i]-=c;if(k==='喂食')food[i]=Math.min(100,food[i]+20);if(k==='医疗')h[i]=100;if(k==='商店')armor[i]=true;if(k==='领养')pet[i]=v;if(k==='学习')iq[i]++;msg.textContent=pairs[ep][i]+'：'+v+' 成功';draw();panel.close()};options.append(btn)}}panel.showModal()}draw()</script></html>
