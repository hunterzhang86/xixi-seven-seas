<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侏罗纪争霸</title><style>*{box-sizing:border-box}body{margin:0;background:#142b26;color:white;font:16px system-ui}main{max-width:540px;margin:auto;padding:12px}button,a{font:inherit;padding:12px;background:#365c48;color:white;border:0;border-radius:9px}section{display:flex;justify-content:space-around;align-items:center;background:linear-gradient(#73a9bc,#9bc77a 70%,#426a38 71%);height:clamp(100px,25dvh,180px);border-radius:12px;font-size:64px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}progress{width:45%;accent-color:#8cdb75}p{margin:8px 0}dialog{background:#254638;color:white;border:0;border-radius:12px}dialog button{margin:4px}body{background:radial-gradient(ellipse at top,#355b47,#101c22 75%)}main{height:100dvh;max-height:760px;display:flex;flex-direction:column;gap:6px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}main>a{align-self:flex-start;padding:5px 12px}main>b{font-size:22px;color:#ffe0a0}section{flex:1;min-height:90px;position:relative;overflow:hidden;background:linear-gradient(160deg,#b0d5cb,#719d8b 55%,#456c42 56%,#263e29);box-shadow:inset 0 0 30px #102d3877}section span{z-index:1;font-size:clamp(48px,17vw,90px);filter:drop-shadow(0 8px 4px #0006)}nav{gap:5px}nav button{padding:9px 3px;min-height:40px;background:linear-gradient(#426957,#263f36);box-shadow:0 2px 0 #101e19;font-size:14px}nav button:nth-child(-n+6){background:linear-gradient(#9a6938,#644023)}nav button:active{transform:scale(.95)}progress{height:12px;width:48%}#stats{font-size:12px}#msg{min-height:22px;color:#ffdb91;text-align:center}dialog{max-width:90vw;max-height:75dvh;overflow:auto}dialog::backdrop{background:#0009} @media(max-height:550px){main{gap:2px}nav button{min-height:32px;padding:5px}main>b{font-size:16px}p{margin:2px 0}}section{isolation:isolate}section span{position:absolute;bottom:22%;width:42%;font-size:0;display:block}section span svg{width:100%;overflow:visible}#left{left:3%}#right{right:3%}#right svg{transform:scaleX(-1)}.fx{position:absolute;z-index:4;pointer-events:none;font:bold 32px system-ui;color:#fff4a0;text-shadow:0 2px 4px #572b00}.orb{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 8px 8px #ffb12d,0 0 22px 12px #ff641c}nav{grid-template-columns:repeat(4,1fr)}nav button{min-height:32px;padding:5px 2px;font-size:12px}section{min-height:85px}</style><main><a href="hall.html">大厅</a> <b>侏罗纪争霸</b> <span id="level"></span><p id="stats"></p><progress id="a" max="100"></progress> <progress id="b" max="100"></progress><section><span id="left">🦕</span><span id="right">🦖</span></section><p id="msg">开始冒险！</p><nav><button onclick="hit(0,10)">左攻击</button><button onclick="hit(0,18)">左技能</button><button onclick="hit(0,25)">左发射</button><button onclick="hit(1,10)">右攻击</button><button onclick="hit(1,18)">右技能</button><button onclick="hit(1,25)">右发射</button><button onclick="menu('喂食')">喂食</button><button onclick="menu('医疗')">医疗</button><button onclick="menu('商店')">商店</button><button onclick="menu('领养')">领养</button><button onclick="menu('学习')">学习</button><button onclick="next()">下一集</button><button onclick="menu('宠物小屋')">宠物小屋</button><button onclick="menu('生活用品')">生活用品</button><button onclick="menu('背包')">背包</button><button onclick="move(0,-1)">左◀</button><button onclick="jump(0)">左跳</button><button onclick="move(0,1)">左▶</button><button onclick="move(1,-1)">右◀</button><button onclick="jump(1)">右跳</button><button onclick="move(1,1)">右▶</button></nav><dialog id="panel"><div id="options"></div><button onclick="panel.close()">返回</button></dialog></main><script>let homes=[false,false],bags=[[],[]],cars=[false,false],pos=[0,0],treated=[false,false];function move(i,d){if(busy||h[i]<=50)return;pos[i]=Math.max(-15,Math.min(15,pos[i]+d*5));document.getElementById(i?'right':'left').style.translate=pos[i]+'px 0'}function jump(i){if(busy||h[i]<=50)return;document.getElementById(i?'right':'left').animate([{transform:'translateY(0)'},{transform:'translateY(-65px)'},{transform:'translateY(0)'}],450)}let last=[0,0], ep=0,h=[100,100],coins=[120,120],food=[80,80],pet=['无','无'],iq=[0,0],armor=[false,false];const pairs=[['三角龙','霸王龙'],['剑龙','迅猛龙'],['甲龙','异特龙'],['腕龙','棘龙'],['厚头龙','牛龙'],['副栉龙','角鼻龙'],['雷龙','南方巨兽龙'],['三角龙','霸王龙']];function art(t){return '<svg viewBox="0 0 180 125"><g stroke="#263b29" stroke-width="2" stroke-linejoin="round" fill="'+(t?'#b77b48':'#8ca95c')+'">'+(t?'<path d="M80 60Q38 45 3 73Q45 75 64 84L68 106 57 117 83 117 94 88 111 88 121 116 144 116 132 104 125 74Q130 52 144 49L174 49 178 30Q165 15 136 20Q111 22 100 49Z"/><path d="M124 61l24 12-3 5-25-9"/><path fill="#fff" d="M145 49l5 8 5-8 5 8 5-8"/>':'<path d="M70 57Q35 53 4 79Q33 80 49 76L47 105 40 117 64 117 70 91 93 91 97 117 118 117 115 91 132 81Q158 91 173 73L169 54 151 49 145 29Q127 8 110 36L104 55Z"/><path d="M108 35Q132 10 149 32L154 65 115 76 100 59Z"/><path fill="#fff0cb" d="M142 43l28-25-15 35M155 59l23-8-15 17"/>')+'<circle cx="153" cy="38" r="4" fill="#ffdd77"/><circle cx="154" cy="38" r="2" fill="#111"/></g></svg>'}function draw(){level.textContent='第'+(ep+1)+'/8集';stats.textContent=pairs[ep].map((n,i)=>n+' '+coins[i]+'🪙 饱食'+food[i]).join(' ｜ ');a.value=h[0];b.value=h[1];left.innerHTML=art(false);right.innerHTML=art(true);stats.textContent=pairs[ep].map((n,i)=>n+' '+h[i]+'HP · '+coins[i]+'🪙 · 饱食'+food[i]+(armor[i]?' 🛡️':'')+(pet[i]!=='无'?' 🐾'+pet[i]:'')+(homes[i]?' 🏠':'')+(cars[i]?' 🚗':'')+' · 智商'+iq[i]).join(' ｜ ')}let busy=false;async function hit(i,n){if(busy||h.some(x=>x<=50)){msg.textContent="重伤不能战斗，请进入医疗室";return;}busy=true;let j=1-i,A=document.getElementById(i?'right':'left'),B=document.getElementById(j?'right':'left'),arena=A.parentElement,ar=A.getBoundingClientRect(),br=B.getBoundingClientRect(),sr=arena.getBoundingClientRect(),dx=br.left-ar.left,dir=Math.sign(dx),damage=Math.max(1,n-(armor[j]?5:0));const wait=ms=>new Promise(r=>setTimeout(r,ms));const effect=(label,x,y,orb=false)=>{let e=document.createElement('div');e.className='fx'+(orb?' orb':'');e.textContent=label;e.style.left=x+'px';e.style.top=y+'px';arena.append(e);return e};let x=ar.left-sr.left+ar.width/2,y=ar.top-sr.top+ar.height*.35;try{msg.textContent=pairs[ep][i]+(n===25?' 发射能量弹！':n===18?' 强力冲撞！':' 冲上去攻击！');if(n===25){let e=effect('',x,y,true);await e.animate([{transform:'translateX(0)'},{transform:'translateX('+dx+'px)'}],{duration:320,fill:'forwards'}).finished;e.remove()}else{await A.animate([{transform:'translateX(0)'},{transform:'translateX('+(-dir*12)+'px)'},{transform:'translateX('+(dx-dir*ar.width*.35)+'px) scale(1.08)'}],{duration:350,fill:'forwards'}).finished}let e=effect('💥',br.left-sr.left+br.width*.35,y);let d=effect('-'+damage,br.left-sr.left+br.width*.5,y-25);d.animate([{transform:'translateY(0)'},{transform:'translateY(-45px)',opacity:0}],{duration:650,fill:'forwards'});B.animate([{transform:'translateX(0)',filter:'brightness(2)'},{transform:'translateX('+(dir*24)+'px) rotate('+(dir*12)+'deg)'},{transform:'translateX(0)'}],350);arena.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],180);h[j]=Math.max(0,h[j]-damage);coins[i]+=h[j]<=50?30:2;food[i]=Math.max(0,food[i]-5);a.value=h[0];b.value=h[1];await wait(180);if(n!==25){let anim=A.getAnimations()[0];if(anim)anim.cancel();await A.animate([{transform:'translateX('+(dx-dir*ar.width*.35)+'px)'},{transform:'translateX(0)'}],250).finished}await wait(250);e.remove();d.remove();draw();if(h[j]<=50){B.style.opacity='.4';msg.textContent=pairs[ep][i]+' 获胜！对手重伤，请治疗'}else msg.textContent=pairs[ep][j]+' 受到 '+damage+' 点伤害！'}finally{busy=false}}function next(){if(busy)return;left.style.opacity=right.style.opacity='1';ep=(ep+1)%8;h=[100,100];draw();msg.textContent='新的挑战！'}function menu(k){if(busy)return;options.replaceChildren();for(let i=0;i<2;i++){let p=document.createElement('p');p.textContent=pairs[ep][i];options.append(p);for(let v of ({喂食:['青草','苹果','肉块'],医疗:['普通听诊器','电子听诊器','儿童听诊器','体温计','消毒用品','创可贴','绷带','夹板','药水','休养'],商店:['盔甲','小车','帽子','衣服','裤子','武器'],领养:['小狗','小猫','小恐龙','小兔','小鸟','乌龟'],学习:['数数','跳跃','认字','画画','唱歌'],宠物小屋:['购买小屋','装饰小屋'],生活用品:['床','水杯','牙刷','毛巾','书包','雨伞','肥皂','枕头','玩具'],背包:bags[i]}[k])){let btn=document.createElement('button');btn.textContent=v;btn.onclick=()=>{let c=k==='喂食'?20:v==='购买小屋'?100:v==='小车'?25:k==='背包'||/听诊器|体温计|休养/.test(v)?0:3;if(coins[i]<c){msg.textContent='金币不足';return}coins[i]-=c;if(k==='喂食')food[i]=Math.min(100,food[i]+20);if(k==='医疗'){if(/听诊器|体温计/.test(v)){msg.textContent=pairs[ep][i]+'：'+(h[i]<=50?'重伤':h[i]<100?'轻伤':'健康');panel.close();return}if(v==='休养'){if(!treated[i]){msg.textContent='请先使用医疗工具治疗';panel.close();return}h[i]=100;treated[i]=false}else{treated[i]=true;h[i]=Math.min(100,h[i]+15);if(h[i]<=50){msg.textContent='继续治疗并休养';panel.close();draw();return}}document.getElementById(i?'right':'left').style.opacity='1';}if(k==='商店'){bags[i].push(v);if(v==='盔甲')armor[i]=true;if(v==='小车')cars[i]=true}if(k==='生活用品')bags[i].push(v);if(k==='宠物小屋'){if(v==='购买小屋')homes[i]=true;else if(!homes[i]){coins[i]+=c;msg.textContent='请先购买小屋';panel.close();return}}if(k==='领养')pet[i]=v;if(k==='学习')iq[i]++;msg.textContent=pairs[ep][i]+'：'+v+' 成功';draw();panel.close()};options.append(btn)}}panel.showModal()}draw()</script></html>
