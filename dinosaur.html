el.textContent='第'+(ep+1)+'/8集';stats.textContent=pairs[ep].map((n,i)=>n+' '+coins[i]+'🪙 饱食'+food[i]).join(' ｜ ');a.value=h[0];b.value=h[1];left.innerHTML=art(false);right.innerHTML=art(true);stats.textContent=pairs[ep].map((n,i)=>n+' '+h[i]+'HP · '+coins[i]+'🪙 · 饱食'+food[i]+(armor[i]?' 🛡️':'')+(pet[i]!=='无'?' 🐾'+pet[i]:'')+(homes[i]?' 🏠':'')+(cars[i]?' 🚗':'')+' · 智商'+iq[i]).join(' ｜ ')}let busy=false;async function hit(i,n){if(busy||h.some(x=>x<=50)){msg.textContent="重伤不能战斗，请进入医疗室";return;}busy=true;let j=1-i,A=document.getElementById(i?'right':'left'),B=document.getElementById(j?'right':'left'),arena=A.parentElement,ar=A.getBoundingClientRect(),br=B.getBoundingClientRect(),sr=arena.getBoundingClientRect(),dx=br.left-ar.left,dir=Math.sign(dx),damage=Math.max(1,n-(armor[j]?5:0));const wait=ms=>new Promise(r=>setTimeout(r,ms));const effect=(label,x,y,orb=false)=>{let e=document.createElement('div');e.className='fx'+(orb?' orb':'');e.textContent=label;e.style.left=x+'px';e.style.top=y+'px';arena.append(e);return e};let x=ar.left-sr.left+ar.width/2,y=ar.top-sr.top+ar.height*.35;try{msg.textContent=pairs[ep][i]+(n===25?' 发射能量弹！':n===18?' '+skills[ep][i]+'！':' 冲上去攻击！');if(n===25){let e=effect('',x,y,true);await e.animate([{transform:'translateX(0)'},{transform:'translateX('+dx+'px)'}],{duration:320,fill:'forwards'}).finished;e.remove()}else{await A.animate([{transform:'translateX(0)'},{transform:'translateX('+(-dir*12)+'px)'},{transform:'translateX('+(dx-dir*ar.width*.35)+'px) scale(1.08)'}],{duration:350,fill:'forwards'}).finished}let e=effect('💥',br.left-sr.left+br.width*.35,y);let d=effect('-'+damage,br.left-sr.left+br.width*.5,y-25);d.animate([{transform:'translateY(0)'},{transform:'translateY(-45px)',opacity:0}],{duration:650,fill:'forwards'});B.animate([{transform:'translateX(0)',filter:'brightness(2)'},{transform:'translateX('+(dir*24)+'px) rotate('+(dir*12)+'deg)'},{transform:'translateX(0)'}],350);arena.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],180);h[j]=Math.max(0,h[j]-damage);coins[i]+=h[j]<=50?30:2;food[i]=Math.max(0,food[i]-5);a.value=h[0];b.value=h[1];await wait(180);if(n!==25){let anim=A.getAnimations()[0];if(anim)anim.cancel();await A.animate([{transform:'translateX('+(dx-dir*ar.width*.35)+'px)'},{transform:'translateX(0)'}],250).finished}await wait(250);e.remove();d.remove();draw();if(h[j]<=50){B.style.opacity='.4';msg.textContent=pairs[ep][i]+' 获胜！对手重伤，请治疗'}else msg.textContent=pairs[ep][j]+' 受到 '+damage+' 点伤害！'}finally{busy=false}}function next(){if(busy)return;left.style.opacity=right.style.opacity='1';ep=(ep+1)%8;h=[100,100];draw();msg.textContent='新的挑战！'}function play(i,k){if(busy)return;if(k==='开车'&&!cars[i]||k==='陪宠物'&&pet[i]==='无'||k==='装饰小屋'&&!homes[i]){msg.textContent='请先购买或领养';return}let el=document.createElement('div');el.className='fx';el.textContent=k==='开车'?'🚗':k==='陪宠物'?(itemIcons[pet[i]]||'🐾'):'🏠🌷';el.style.top='45%';el.style.left=i?'65%':'10%';document.querySelector('section').append(el);el.animate([{transform:'translateX(0)'},{transform:'translateX('+(i?-75:75)+'px)'},{transform:'translateX(0)'}],900);setTimeout(()=>el.remove(),950);msg.textContent=k+'！';}function menu(k){if(busy)return;options.replaceChildren();for(let i=0;i<2;i++){let p=document.createElement('p');p.textContent=pairs[ep][i];options.append(p);for(let v of ({喂食:['青草','苹果','肉块'],医疗:['普通听诊器','电子听诊器','儿童听诊器','体温计','消毒用品','创可贴','绷带','夹板','药水','休养'],商店:['盔甲','小车','帽子','衣服','裤子','武器'],领养:['小狗','小猫','小恐龙','小兔','小鸟','乌龟'],学习:['数数','跳跃','认字','画画','唱歌'],宠物小屋:['购买小屋','装饰小屋'],生活用品:['床','水杯','牙刷','毛巾','书包','雨伞','肥皂','枕头','玩具'],背包:bags[i]}[k])){let btn=document.createElement('button');btn.innerHTML='<span class="pic" aria-hidden="true">'+(itemIcons[v]||'📦')+'</span><span class="word"></span>';btn.querySelector('.word').textContent=v;btn.setAttribute('aria-label',v);btn.onclick=()=>{let c=k==='喂食'?20:v==='购买小屋'?100:v==='小车'?25:k==='背包'||/听诊器|体温计|休养/.test(v)?0:3
